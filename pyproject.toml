[project]
name = "ts-agent"
version = "0.1.0"
description = "RAG and agent demo project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20,<1",
    "dashscope>=1.23.9",
    "fastapi>=0.116.0",
    "httpx[socks]>=0.28.1",
    "langchain>=1.3,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-core>=1.4,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-openai>=1.3,<2",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "onnxruntime<1.24; python_version < '3.11'",
    "protobuf==3.20.3",
    "python-dotenv>=1.1.1",
    "pypdf>=5.8.0",
    "pyyaml>=6.0.2",
    "requests>=2.32,<3",
    "sse-starlette>=3,<4",
    "streamlit>=1.49.0",
    "uvicorn>=0.35.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langchain-tavily>=0.2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ts_agent"]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/ts_agent/vendor/taoke-mcp-main"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
